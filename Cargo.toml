[package]
name = "shiguredo_http11"
version = "2026.5.0"
edition.workspace = true
rust-version.workspace = true
description = "HTTP/1.1 Library"
readme = "README.md"
homepage = "https://github.com/shiguredo/http11-rs"
repository = "https://github.com/shiguredo/http11-rs"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = [
  "examples/http11_client",
  "examples/http11_reverse_proxy",
  "examples/http11_server",
  "pbt",
]
exclude = ["examples/http11_server_io_uring", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
# 本ライブラリ (workspace ルートを参照)
shiguredo_http11 = { path = "." }

[workspace.lints.rust]
# unsafe ブロックを禁止する
unsafe_code = "deny"

[workspace.lints.clippy]
# Clippy 組み込みデフォルト (correctness / style 等の warn) はここでは触らない。
# prek / CI の `cargo clippy ... -- -D warnings` がそれらの warn を deny に昇格する。
# 以下だけ restriction グループ (単体では allow) を追加で deny する。
# `core` で済む import に `alloc` を使うことを禁止する
alloc_instead_of_core = "deny"
# 理由なし #[allow] を禁止する
allow_attributes_without_reason = "deny"
# デバッグ用マクロを本番コードに残さない
dbg_macro = "deny"
# 未完成の unimplemented! を残さない
unimplemented = "deny"

[dependencies]

[lints]
workspace = true
