minimum_prek_version = "0.4.0"
fail_fast = true

# 生成物・参照 RFC 資料はフック対象外
exclude = {
  glob = [
    "target/**",
    "refs/**",
    "fuzz/artifacts/**",
    "fuzz/corpus/**",
    "fuzz/target/**",
  ]
}

default_install_hook_types = ["pre-commit", "pre-push"]

# pre-commit: 静的チェック + ユニットテスト (CI ci job と同等)
# pre-push: ユニットテスト + e2e (curl / Docker が必要; CI e2e-test job と同等)

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-merge-conflict", priority = 0 },
  { id = "detect-private-key", priority = 0 },
  { id = "mixed-line-ending", priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-symlinks", priority = 0 },
  { id = "fix-byte-order-marker", priority = 0 },
  { id = "check-yaml", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-added-large-files", priority = 0, args = ["--maxkb=500"] },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply", priority = 5, files = "prek\\.toml$" },
  { id = "check-useless-excludes", priority = 5, files = "prek\\.toml$" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "tombi-fmt",
    name = "tombi fmt",
    entry = "tombi format --check",
    language = "system",
    types = ["toml"],
    pass_filenames = false,
    require_serial = true,
    priority = 5,
  },
  {
    id = "tombi-lint",
    name = "tombi lint",
    entry = "tombi lint",
    language = "system",
    types = ["toml"],
    pass_filenames = false,
    require_serial = true,
    priority = 6,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    require_serial = true,
    priority = 10,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    require_serial = true,
    priority = 20,
  },
  {
    id = "cargo-test",
    name = "cargo test",
    # CI の ci job と同じ除外 (curl / Docker を要する e2e は pre-push)
    entry = "cargo test --workspace --exclude http11_client --exclude http11_server",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    require_serial = true,
    priority = 30,
    stages = ["pre-commit", "pre-push"],
  },
  {
    id = "cargo-test-e2e",
    name = "cargo test (e2e)",
    entry = "cargo test -p http11_client -p http11_server",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    require_serial = true,
    priority = 40,
    stages = ["pre-push"],
  },
]
